asyncapi: 3.0.0
info:
  title: Streaming Events WebSocket API
  version: 1.0.0
  description: The WebSocket API for Streaming Events application

servers:
  local:
    host: localhost:3000
    protocol: ws
    description: Local Development WebSocket server

channels:
  /:
    address: /
    messages:
      connect:
        $ref: '#/components/messages/connectMessage'
      disconnect:
        $ref: '#/components/messages/disconnectMessage'

components:
  messages:
    connectMessage:
      name: connection
      title: Client Connection
      summary: Message sent when client connects to WebSocket server
      contentType: application/json
    
    disconnectMessage:
      name: disconnect
      title: Client Disconnection
      summary: Message sent when client disconnects from WebSocket server
      contentType: application/json